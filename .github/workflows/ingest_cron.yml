name: Scheduled GDELT Ingestion

on:
  schedule:
    # Runs every 15 minutes (free on public and private GitHub repositories)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Allows manual one-click trigger from GitHub Actions tab

jobs:
  trigger-ingestion:
    name: Trigger Ingest Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Happening-Board Ingestion Endpoint
        run: |
          echo "Triggering GDELT ingestion on ${{ secrets.APP_URL }}..."

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.APP_URL }}/api/v1/ingest/trigger?max_records=50" \
            -H "X-API-Key: ${{ secrets.INGEST_API_KEY }}" \
            -H "Content-Type: application/json")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "HTTP Status Code: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Ingestion successfully triggered."
            exit 0
          else
            echo "Error: Failed to trigger ingestion. Expected 2xx, got $STATUS"
            exit 1
          fi
