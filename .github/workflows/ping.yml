name: Keep API Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API
        run: |
          echo "Pinging ${{ secrets.APP_URL }}/health..."

          curl -f \
            --max-time 260 \
            "${{ secrets.APP_URL }}/health"

          echo "API is reachable."
