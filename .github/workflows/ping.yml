name: Keep API Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping API
        run: |
          echo "Pinging ${{ secrets.APP_URL }}/health..."

          curl -f --max-time 30 \
            "${{ secrets.APP_URL }}/health"

          echo "API is reachable."